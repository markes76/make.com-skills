name: Publish npm bridge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after checks (requires the protected npm-publish environment)
        type: boolean
        default: false
      release_tag:
        description: Exact existing release tag to publish, for example v0.4.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: python3 scripts/validate_project.py
      - run: python3 scripts/validate_evaluations.py
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_npm_version.py
      - run: npm --prefix npm run bundle-python
      - run: npm --prefix npm test
      - run: npm pack --dry-run --json
        working-directory: npm
      - name: Verify GitHub Release tag matches VERSION
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
      - name: Verify manually requested release tag matches this commit and VERSION
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

  publish:
    needs: verify
    if: github.event_name == 'release' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm --prefix npm run bundle-python
      - run: npm --prefix npm test
      - run: npm publish
        working-directory: npm
